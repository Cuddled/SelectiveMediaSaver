name: Set up Revenge plugin build
description: Installs pinned Java/Android/JS tooling and publishes the pinned Revenge API locally.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle

    - name: Install Android SDK platforms and build tools
      shell: bash
      run: |
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$sdkmanager_bin" ]]; then
          sdkmanager_bin="$({ find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -print 2>/dev/null || true; } | sort -V | tail -n 1)"
        fi
        if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
          echo "sdkmanager was not found under $sdk_root" >&2
          exit 1
        fi
        yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
        "$sdkmanager_bin" \
          'platform-tools' \
          'platforms;android-36' \
          'build-tools;36.0.0'

    - name: Restore the pinned Gradle wrapper JAR
      shell: bash
      run: bash scripts/bootstrap-gradle-wrapper.sh

    - name: Publish the pinned Revenge native API to Maven Local
      shell: bash
      run: bash scripts/prepare-revenge-api.sh "$RUNNER_TEMP/revenge-xposed"

    - name: Install pinned JavaScript dependencies
      shell: bash
      run: npm ci
