name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-revenge-build

      - name: Lint workflow scripts
        run: shellcheck .github/scripts/*.sh scripts/*.sh

      - name: Lint TypeScript and JSON
        run: npm run lint

      - name: Type-check plugin sources
        run: npm run lint:types

      - name: Test capture and filtering logic
        run: npm test

      - name: Build Classic Revenge bundle
        run: npm run build:classic

      - name: Verify Classic Revenge loader and runtime
        run: npm run verify:classic

      - name: Build and package all plugins
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Verify original media byte copying
        run: ./gradlew --no-daemon :plugins:com.cuddled.nocompression:testDebugUnitTest

      - name: Verify packaged repository metadata
        run: |
          npm run generate-index -- \
            --dist build/dist \
            --base-url https://revenge.local/pool \
            --out /tmp/index.json
          jq . /tmp/index.json

      - name: Stage and validate GitHub Pages layout
        env:
          POOL_CHECKOUT: build/pages
          POOL_REMOTE: https://github.com/${{ github.repository }}.git
          PAGES_BASE_URL: https://revenge.local
          REQUIRE_POOL: 1
        run: |
          bash .github/scripts/checkout-pool.sh
          : > build/pages-plan.tsv
          for zip in build/dist/*.zip; do
            file="$(basename "$zip")"
            if [ ! -f "build/pages/pool/$file" ]; then
              printf '%s\t%s\n' "$zip" "$file" >> build/pages-plan.tsv
            fi
          done
          bash .github/scripts/update-pages-tree.sh build/pages-plan.tsv

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: selective-media-saver-revenge
          path: |
            build/dist/*.zip
            build/classic/manifest.json
            build/classic/index.js
            build/pages/manifest.json
            build/pages/index.js
            build/pages/index.json
            build/pages/next/index.json
            build/pages/themes/midnight-glass/theme.json
            build/pages/themes/midnight-glass/background-v1.png
          if-no-files-found: error
